<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projeto 5º Elemento — Sintetizador Biométrico</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body { 
            background-color: #0b0e14; 
            color: #fff; 
            font-family: system-ui, -apple-system, sans-serif; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            min-height: 100vh; 
            padding-bottom: 40px;
        }

        /* Menu Superior de Navegação do Ecossistema */
        .nav-ecossistema {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            background-color: #111111;
            padding: 12px 15px;
            width: 100%;
            border-bottom: 1px solid #333333;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.6);
            flex-wrap: wrap;
            margin-bottom: 25px;
        }

        .nav-ecossistema a {
            color: #00bcff;
            text-decoration: none;
            font-weight: bold;
            font-size: 13px;
            padding: 8px 16px;
            border: 1px solid #00bcff;
            border-radius: 6px;
            transition: all 0.3s ease;
            white-space: nowrap;
        }

        .nav-ecossistema a:hover, .nav-ecossistema a.ativo {
            background-color: #00bcff;
            color: #111111;
            box-shadow: 0 0 10px rgba(0, 188, 255, 0.5);
        }

        /* Container do Cartão Dimensionado */
        .card { 
            border: 2px solid #f3ba2f; 
            border-radius: 16px; 
            padding: 25px; 
            width: 92%;
            max-width: 720px; 
            background-color: #121721; 
            text-align: center; 
            box-shadow: 0 0 25px rgba(243, 186, 47, 0.3); 
        }

        h1 { 
            color: #f3ba2f; 
            font-size: 22px; 
            margin-bottom: 4px; 
            letter-spacing: 1.5px; 
        }

        p.sub { 
            font-size: 12px; 
            color: #aaa; 
            letter-spacing: 1.2px; 
            margin-bottom: 20px; 
        }

        /* Caixa de Exibição do Resultado e Imagem */
        .display-box { 
            background-color: #080a0f; 
            border: 1px solid #f3ba2f; 
            border-radius: 10px; 
            padding: 15px; 
            min-height: 60px; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            margin: 15px 0; 
            color: #f3ba2f; 
            font-weight: bold; 
            font-size: 15px; 
            flex-direction: column; 
            gap: 12px; 
        }

        .display-img { 
            width: 100%; 
            max-width: 680px; 
            border-radius: 10px; 
            display: none; 
            margin-top: 10px; 
            border: 1px solid #f3ba2f; 
            box-shadow: 0 0 15px rgba(243, 186, 47, 0.2);
        }

        /* Formulários de Entrada */
        .inputs { 
            display: flex; 
            justify-content: space-between; 
            gap: 15px; 
            margin-top: 20px;
            margin-bottom: 20px; 
        }

        .input-group { text-align: left; flex: 1; }

        label { font-size: 12px; color: #aaa; display: block; margin-bottom: 6px; }

        input { 
            width: 100%; 
            padding: 12px; 
            border-radius: 6px; 
            border: 1px solid #333; 
            background-color: #080a0f; 
            color: #fff; 
            font-size: 15px;
        }

        button.btn-analisar { 
            width: 100%; 
            padding: 15px; 
            background-color: #f3ba2f; 
            border: none; 
            border-radius: 8px; 
            font-weight: bold; 
            cursor: pointer; 
            color: #000; 
            font-size: 15px; 
            letter-spacing: 0.8px;
            transition: all 0.3s ease;
        }

        button.btn-analisar:hover { 
            background-color: #e0a820; 
            box-shadow: 0 0 12px rgba(243, 186, 47, 0.5);
        }
    </style>
</head>
<body>

    <!-- Menu Superior Conectado do Ecossistema -->
    <nav class="nav-ecossistema">
        <a href="https://donicatia1206.github.io/donicatia1206/">🧮 Balanço Energético</a>
        <a href="https://donicatia1206.github.io/CAPTAIN_PLANET_PROJECT/" class="ativo">🤖 Sintetizador IA</a>
        <a href="https://donicatia1206.github.io/lagrimas_emocionais/">🎨 Portais da Alma</a>
    </nav>

    <div class="card">
        <h1>PROJETO 5º ELEMENTO</h1>
        <p class="sub">SINTETIZADOR BIOMÉTRICO DE LÁGRIMAS</p>
        
        <div class="display-box" id="resultado">
            <span id="texto-resultado">Informe a biometria para a IA analisar...</span>
            <img id="img-emocao" class="display-img" src="" alt="Estado Emocional">
        </div>
        
        <div class="inputs">
            <div class="input-group">
                <label>Batimentos (BPM):</label>
                <input type="number" id="bpm" value="70">
            </div>
            <div class="input-group">
                <label>Estresse (0-100):</label>
                <input type="number" id="estresse" value="20">
            </div>
        </div>
        
        <button class="btn-analisar" onclick="analisarBiometria()">ANALISAR BIOMETRIA COM IA</button>
    </div>

    <script>
        const imagens = {
            "GRATIDAO": "assets/gratidao.png",
            "PAZ": "assets/paz.png",
            "ALEGRIA": "assets/alegria.png",
            "TRISTEZA": "assets/tristeza.png",
            "DOR_DA_ALMA": "assets/dor_da_alma.png",
            "RAIVA": "assets/raiva.png"
        };

        async function analisarBiometria() {
            const bpm = document.getElementById('bpm').value;
            const estresse = document.getElementById('estresse').value;
            const textoDisplay = document.getElementById('texto-resultado');
            const imgDisplay = document.getElementById('img-emocao');

            textoDisplay.innerText = "Analisando com IA...";
            imgDisplay.style.display = "none";

            try {
               const response = await fetch('https://captain-planet-project.onrender.com/analisar', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ bpm: parseFloat(bpm), estresse: parseFloat(estresse) })
                });

                const data = await response.json();
                textoDisplay.innerText = `[ESTADO: ${data.estado}]\n${data.mensagem}`;
                
                if (imagens[data.estado]) {
                    imgDisplay.src = imagens[data.estado];
                    imgDisplay.style.display = "block";
                }
            } catch (error) {
                textoDisplay.innerText = "Erro ao conectar com o servidor Python na nuvem!";
            }
        }
    </script>
</body>
</html>
